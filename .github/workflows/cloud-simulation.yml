name: Commonwealth cloud simulation
on:
  workflow_dispatch:
  push:
    branches:
      - step-9-independent-setup
    paths:
      - .github/workflows/cloud-simulation.yml
permissions:
  contents: read
  actions: read
jobs:
  step-7:
    outputs:
      root_pin: ${{ steps.trust_pins.outputs.fingerprint }}
      verifier_pin: ${{ steps.trust_pins.outputs.verify_sha256 }}
      consumer_pin: ${{ steps.trust_pins.outputs.consumer_sha256 }}
      trust_pin: ${{ steps.trust_pins.outputs.trust_sha256 }}
      source_pin: ${{ steps.trust_pins.outputs.source_revision }}
      kit_pin: ${{ steps.trust_pins.outputs.version }}
      bootstrap_id: ${{ steps.kit_boot.outputs.artifact-id }}
      bootstrap_sha: ${{ steps.kit_boot.outputs.artifact-digest }}
      release_id: ${{ steps.kit_release.outputs.artifact-id }}
      release_sha: ${{ steps.kit_release.outputs.artifact-digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: simulation
      PYTHONDONTWRITEBYTECODE: "1"
      CHECKOUT_ACTION_SHA: 11bd71901bbe5b1630ceea73d27597364c9af683
      UPLOAD_ACTION_SHA: ea165f8d65b6e75b540449e92b4886f43607fa02
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify revision and run smoke
        run: |
          mkdir -p "$RUNNER_TEMP/commonwealth"
          export CHECKOUT_SHA="$(git rev-parse HEAD)"
          if [[ "$CHECKOUT_SHA" != "$GITHUB_SHA" ]]; then
            printf 'Expected %s, checked out %s\n' "$GITHUB_SHA" "$CHECKOUT_SHA" > "$RUNNER_TEMP/commonwealth/checkout-error.txt"
            exit 2
          fi
          python3 --version
          python3 -m commonwealth_sim smoke --topology simulation/fixtures/topology.json --out "$RUNNER_TEMP/commonwealth/smoke.json"
      - name: Run Step 3
        run: |
          export CHECKOUT_SHA="$(git rev-parse HEAD)"
          python3 -m commonwealth_sim run --topology simulation/fixtures/topology.json --cases simulation/fixtures/cases.json --suite step-3 --out "$RUNNER_TEMP/commonwealth/step-3"
      - name: Run Step 4
        run: |
          export CHECKOUT_SHA="$(git rev-parse HEAD)"
          python3 -m commonwealth_sim run --topology simulation/fixtures/topology.json --cases simulation/fixtures/cases.json --suite step-4 --out "$RUNNER_TEMP/commonwealth/step-4"
      - name: Run Step 5
        run: |
          export CHECKOUT_SHA="$(git rev-parse HEAD)"
          python3 -m commonwealth_sim run --topology simulation/fixtures/topology.json --cases simulation/fixtures/cases.json --suite step-5 --out "$RUNNER_TEMP/commonwealth/step-5"
      - name: Run Step 6 twice and compare clean replays and fixture-authorized effects
        run: |
          export CHECKOUT_SHA="$(git rev-parse HEAD)"
          root="$RUNNER_TEMP/commonwealth"
          status=0
          python3 -m commonwealth_sim run --topology simulation/fixtures/topology.json --cases simulation/fixtures/cases.json --suite step-6 --out "$root/step-6" || status=$?
          replay=0
          python3 -m commonwealth_sim run --topology simulation/fixtures/topology.json --cases simulation/fixtures/cases.json --suite step-6 --out "$root/step-6-replay" || replay=$?
          comparison=0
          python3 -m commonwealth_sim.replay "$root" || comparison=$?
          if [[ "$status" == 1 || "$replay" == 1 || "$comparison" == 1 ]]; then exit 1; fi
          if [[ "$status" != 0 || "$replay" != 0 || "$comparison" != 0 ]]; then exit 2; fi
      - name: Stage Ubuntu DHCP, DNS and conntrack tools
        run: |
          if command -v dnsmasq >/dev/null && command -v conntrack >/dev/null; then exit 0; fi
          mkdir -p "$RUNNER_TEMP/commonwealth-tools"
          cd "$RUNNER_TEMP/commonwealth-tools"
          if timeout 35s apt-get download dnsmasq-base; then
            set -- dnsmasq-base_*.deb
            if [[ "$#" == 1 && -f "$1" ]]; then
              dpkg-deb -f "$1" Package Version Architecture
              sha256sum "$1"
              dpkg-deb -x "$1" extracted
              echo "PILOT_DNSMASQ=$PWD/extracted/usr/sbin/dnsmasq" >> "$GITHUB_ENV"
            fi
          else
            echo "::warning::Ubuntu dnsmasq syntax checker could not be staged"
          fi
          if ! command -v conntrack >/dev/null; then
            if timeout 35s apt-get download conntrack; then
              set -- conntrack_*.deb
              if [[ "$#" == 1 && -f "$1" ]]; then
                dpkg-deb -f "$1" Package Version Architecture
                sha256sum "$1"
                dpkg-deb -x "$1" extracted
                echo "PILOT_CONNTRACK=$PWD/extracted/usr/sbin/conntrack" >> "$GITHUB_ENV"
              fi
            else
              echo "::warning::Ubuntu conntrack could not be staged"
            fi
          fi
      - name: Run Step 7 deterministic preparation and isolated Linux fail-closed restart and rollback
        run: |
          root="$RUNNER_TEMP/commonwealth"
          model=0
          python3 -m commonwealth_sim.pilot model pilot/fixture-profile.json pilot/field-receipt.json pilot/cases.json "$root/step-7/model.json" || model=$?
          gateway=0
          python3 -m commonwealth_sim.pilot gateway pilot/fixture-profile.json pilot/field-receipt.json pilot/cases.json "$root/step-7/gateway.json" || gateway=$?
          if [[ "$model" == 1 || "$gateway" == 1 ]]; then exit 1; fi
          if [[ "$model" != 0 || "$gateway" != 0 ]]; then
            echo "::warning::Step 7 has an unverified preparation layer"
          fi
      - name: Expose bounded synthetic acceptance receipts
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "commonwealth"
          names = (
              "execution-manifest.json", "smoke.json",
              "step-3/execution-manifest.json", "step-3/summary.json",
              "step-3/access.json", "step-3/dns.json",
              "step-3/isolation.json", "step-3/withdrawal.json",
          )
          names += tuple(
              str(path.relative_to(root))
              for suite in ("step-4", "step-5")
              for path in sorted((root / suite).glob("*.json"))
          )
          names += tuple(
              str(path.relative_to(root))
              for suite in ("step-6", "step-6-replay")
              for path in sorted((root / suite).glob("*.json"))
          ) + ("replay-comparison.json", "step-7/model.json", "step-7/gateway.json")
          for name in names:
              path = root / name
              if not path.is_file():
                  print(json.dumps({"receipt": name, "status": "missing"}))
                  continue
              data = json.loads(path.read_text())
              record = {key: data[key] for key in data if key not in ("trace", "diagnostics", "namespace_commands")}
              if data.get("incomplete") and data.get("diagnostics"):
                  for diagnostic in data["diagnostics"]:
                      if diagnostic.get("stderr"):
                          print(json.dumps({"receipt": name, "actor": diagnostic["role"],
                                            "diagnostic": diagnostic["stderr"][-2000:]}))
              if name.startswith(("step-6/", "step-6-replay/", "step-7/")) and "checks" in record:
                  checks = record.pop("checks")
                  for index in range(0, len(checks), 8):
                      chunk = {"receipt": name, "check_offset": index, "checks": checks[index:index+8]}
                      print(json.dumps(chunk, ensure_ascii=True, separators=(",", ":")))
              envelope = json.dumps({"receipt": name, "data": record}, ensure_ascii=True, separators=(",", ":"))
              if len(envelope) > 16384:
                  print(json.dumps({"receipt": name, "status": "exceeds log bound"}))
                  continue
              print(envelope)
          PY
      - name: Hash original evidence before transfer
        if: always()
        run: python3 -m commonwealth_sim.custody prepare "$RUNNER_TEMP/commonwealth"
      - name: Preserve simulation evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commonwealth-step-7
          path: ${{ runner.temp }}/commonwealth
          if-no-files-found: error
          retention-days: 14
      - name: Download archived originals
        id: archive
        continue-on-error: true
        if: always() && steps.upload.outcome == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/commonwealth-archived
      - name: Verify archived members and expose original and semantic evidence
        if: always() && steps.upload.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          root="$RUNNER_TEMP/commonwealth"
          archive="$RUNNER_TEMP/commonwealth-archived"
          if [[ -f "$archive/archive-members.json" ]]; then
            python3 -m commonwealth_sim.custody verify "$root" "$archive"
          else
            python3 -m commonwealth_sim.custody original "$root"
          fi
      - name: Verify archive through GitHub REST when action download fails
        if: always() && steps.upload.outcome == 'success' && steps.archive.outcome != 'success'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          root="$RUNNER_TEMP/commonwealth"
          archive="$RUNNER_TEMP/commonwealth-archived"
          python3 -m commonwealth_sim.custody recover "$root" "$archive"
          python3 -m commonwealth_sim.custody verify "$root" "$archive" > "$RUNNER_TEMP/commonwealth-rest-proof.ndjson"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          for line in (Path(os.environ["RUNNER_TEMP"]) / "commonwealth-rest-proof.ndjson").read_text().splitlines():
              if "custody" in json.loads(line):
                  print(line)
          PY
      - name: Provision trust pins through the trusted fixture workflow before candidate construction
        id: trust_pins
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "commonwealth" / "step-7"
          for item in ("model", "gateway"):
              receipt = json.loads((root / (item + ".json")).read_text())
              if receipt["revision"] != os.environ["GITHUB_SHA"] or receipt["verdict"] != "PASS":
                  raise SystemExit("Step 7 cloud preparation must pass before Kit production")
          PY
          umask 077
          python3 kit/trusted_fixture.py provision "$RUNNER_TEMP/commonwealth-kit"
      - name: Publish separate trusted fixture inputs
        id: kit_boot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kit-step8-bootstrap
          path: ${{ runner.temp }}/commonwealth-kit/bootstrap
          retention-days: 14
          if-no-files-found: error
      - name: Build unsigned candidates under an unprivileged identity
        run: |
          work="$(mktemp -d)"
          trap 'sudo -n rm -rf -- "$work"' EXIT
          chmod 755 "$work"
          mkdir "$work/source"
          cp kit/build.py kit/verify_kit.py "$work/source/"
          cp -R kit/package "$work/source/"
          chmod -R a+rX "$work/source"
          sudo -n install -d -m 700 -o nobody "$work/unsigned"
          sudo -n runuser -u nobody -- test ! -r "$RUNNER_TEMP/commonwealth-kit/private/release.key"
          sudo -n runuser -u nobody -- test ! -w "$RUNNER_TEMP/commonwealth-kit/bootstrap"
          sudo -n unshare --net runuser -u nobody -- env -i PATH=/usr/bin:/bin \
            GITHUB_SHA="$GITHUB_SHA" PYTHONDONTWRITEBYTECODE=1 \
            python3 "$work/source/build.py" "$work/unsigned"
          sudo -n sh -c 'cp -R -- "$1" "$2" && chown -R -- "$3" "$2"' sh \
            "$work/unsigned" "$RUNNER_TEMP/commonwealth-kit/unsigned" "$USER"
          echo "unsigned builder: nobody; private key unreadable; trusted bootstrap unwritable"
      - name: Sign approved coordinates with the trusted fixture key
        run: |
          umask 077
          python3 kit/trusted_fixture.py sign "$RUNNER_TEMP/commonwealth-kit" "$RUNNER_TEMP/commonwealth-kit/unsigned"
      - name: Publish candidate and negative releases
        id: kit_release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kit-step8-release
          path: ${{ runner.temp }}/commonwealth-kit/release
          retention-days: 14
          if-no-files-found: error

  step-8-consumer:
    needs: step-7
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Provision trusted inputs first, then obtain the candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_PIN: ${{ needs.step-7.outputs.root_pin }}
          VERIFIER_PIN: ${{ needs.step-7.outputs.verifier_pin }}
          CONSUMER_PIN: ${{ needs.step-7.outputs.consumer_pin }}
          TRUST_PIN: ${{ needs.step-7.outputs.trust_pin }}
          SOURCE_PIN: ${{ needs.step-7.outputs.source_pin }}
          KIT_PIN: ${{ needs.step-7.outputs.kit_pin }}
          BOOT_ID: ${{ needs.step-7.outputs.bootstrap_id }}
          BOOT_SHA: ${{ needs.step-7.outputs.bootstrap_sha }}
          RELEASE_ID: ${{ needs.step-7.outputs.release_id }}
          RELEASE_SHA: ${{ needs.step-7.outputs.release_sha }}
        run: |
          root="$RUNNER_TEMP/kit-consumer"
          mkdir -p "$root"
          download() {
            id="$1" digest="$2" role="$3"
            for attempt in 1 2 3; do
              if curl --fail --silent --show-error --location --max-time 15 --max-filesize 8388608 \
                -H "Authorization: Bearer $GH_TOKEN" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
                -o "$root/$role.zip"; then break; fi
              if [[ "$attempt" == 3 ]]; then return 1; fi
              sleep 2
            done
            echo "${digest#sha256:}  $root/$role.zip" | sha256sum --check
            python3 - "$root/$role.zip" "$root/$role" <<'PY'
          import sys, zipfile
          from pathlib import Path, PurePosixPath
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = archive.namelist()
              if (len(names) != len(set(names)) or len(names) > 32
                  or any(PurePosixPath(n).is_absolute() or ".." in PurePosixPath(n).parts for n in names)
                  or sum(member.file_size for member in archive.infolist()) > 8 * 1024 ** 2):
                  raise SystemExit("invalid fixture artifact")
              archive.extractall(sys.argv[2])
          PY
            echo "$role artifact $id SHA-256 $digest verified"
          }
          download "$BOOT_ID" "$BOOT_SHA" bootstrap
          python3 - "$root/bootstrap" "$root/trust-check.json" <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          directory = Path(sys.argv[1])
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          record = (directory / "trust.json").read_bytes()
          pins = {"fingerprint": os.environ["ROOT_PIN"], "source_revision": os.environ["SOURCE_PIN"],
                  "version": os.environ["KIT_PIN"], "verify_sha256": os.environ["VERIFIER_PIN"],
                  "consumer_sha256": os.environ["CONSUMER_PIN"]}
          der = subprocess.check_output(["openssl", "pkey", "-pubin", "-in",
                                         str(directory / "release-root.pem"), "-outform", "DER"])
          actual = {"fingerprint": sha(der), "verify_sha256": sha((directory / "verify_kit.py").read_bytes()),
                    "consumer_sha256": sha((directory / "consume.py").read_bytes()),
                    "source_revision": os.environ["GITHUB_SHA"], "version": "0.1.0-test.1"}
          if (pins != actual or sha(record) != os.environ["TRUST_PIN"]
              or any(json.loads(record).get(k) != v for k, v in pins.items())):
              raise SystemExit("bootstrap does not match trusted orchestration pins")
          decision = {"decision": "verified_trusted_orchestration_pins_before_candidate_delivery",
                      "pins": pins, "trust_record_sha256": sha(record)}
          Path(sys.argv[2]).write_text(json.dumps(decision))
          print(json.dumps(decision))
          PY
          download "$RELEASE_ID" "$RELEASE_SHA" release
          python3 - "$root/staged.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1], "w") as out:
              json.dump({role: {"id": os.environ[role + "_ID"], "sha256": os.environ[role + "_SHA"]}
                         for role in ("BOOT", "RELEASE")}, out)
          PY
      - name: Exercise installed Kit and setup authority in loopback-only namespace
        run: |
          root="$RUNNER_TEMP/kit-consumer"
          mkdir "$root/empty" "$root/evidence"
          cd "$root/empty"
          test -z "$(ls -A)"
          python3 --version
          openssl version
          sudo -n ip netns add cw-kit
          trap 'sudo -n ip netns del cw-kit' EXIT
          sudo -n ip -n cw-kit link set lo up
          sudo -n ip netns exec cw-kit runuser -u "$USER" -- \
            env -i PATH=/usr/bin:/bin HOME="$root/empty" PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" \
            timeout 120s python3 "$root/bootstrap/consume.py" \
              --bootstrap "$root/bootstrap" --release "$root/release" \
              --revision "$GITHUB_SHA" --out "$root/evidence/step-8.json"
      - name: Print bounded Step 8 receipts
        if: always()
        run: |
          root="$RUNNER_TEMP/kit-consumer"
          python3 - "$root" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          p = root / "evidence" / "step-8.json"
          if not p.is_file():
              print(json.dumps({"step8": "UNVERIFIED", "reason": "consumer receipt absent"}))
              raise SystemExit(0)
          raw = p.read_bytes()
          data = json.loads(raw)
          for i in range(0, len(data["checks"]), 5):
              print(json.dumps({"check_offset": i, "checks": data["checks"][i:i+5]}, separators=(",", ":")))
          print(json.dumps({k: data[k] for k in ("revision", "verdict", "incomplete", "installation", "trust")},
                           separators=(",", ":")))
          proof = {"receipt_sha256": hashlib.sha256(raw).hexdigest(), "staged": json.loads((root / "staged.json").read_text()),
                   "trusted_inputs": json.loads((root / "trust-check.json").read_text())}
          print(json.dumps(proof, separators=(",", ":")))
          (p.parent / "custody.json").write_text(json.dumps(proof))
          PY
      - name: Preserve Step 8 consumer evidence
        id: kit_receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kit-step8-consumer
          path: ${{ runner.temp }}/kit-consumer/evidence
          retention-days: 14
          if-no-files-found: error
      # Run the branch workflow again for changes to the guide packed in the signed archive.
      - name: Re-read the consumer evidence archive
        if: always() && steps.kit_receipt.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_ID: ${{ steps.kit_receipt.outputs.artifact-id }}
          RECEIPT_SHA: ${{ steps.kit_receipt.outputs.artifact-digest }}
        run: |
          root="$RUNNER_TEMP/kit-consumer"
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --location --max-time 15 --max-filesize 8388608 \
              -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$RECEIPT_ID/zip" \
              -o "$root/receipt.zip"; then break; fi
            if [[ "$attempt" == 3 ]]; then exit 2; fi
            sleep 2
          done
          echo "${RECEIPT_SHA#sha256:}  $root/receipt.zip" | sha256sum --check
          python3 - "$root" <<'PY'
          import hashlib, json, os, sys, zipfile
          from pathlib import Path
          root = Path(sys.argv[1])
          with zipfile.ZipFile(root / "receipt.zip") as archive:
              members = archive.namelist()
              if sorted(members) != ["custody.json", "step-8.json"]:
                  raise SystemExit("wrong consumer archive members")
              digests = {}
              for name in members:
                  archived = archive.read(name)
                  if archived != (root / "evidence" / name).read_bytes():
                      raise SystemExit("consumer archive member differs")
                  digests[name] = hashlib.sha256(archived).hexdigest()
          print(json.dumps({"step8_custody": "verified", "artifact_id": os.environ["RECEIPT_ID"],
                            "archive_sha256": os.environ["RECEIPT_SHA"], "members": digests}))
          PY
      - name: Stage the pinned optional Codex CLI and locate headless Chrome
        run: |
          tools="$RUNNER_TEMP/kit-step9-tools"
          mkdir -p "$tools"
          asset="https://github.com/openai/codex/releases/download/rust-v0.172.0/codex-x86_64-unknown-linux-musl.tar.gz"
          if curl --fail --silent --show-error --location --max-time 20 --retry 2 --retry-delay 1 --retry-all-errors \
              "$asset?fixture=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -o "$tools/codex.tar.gz"; then
            echo "a2342a8f7f68f088be30620ccfe9cb84162c93a6b56177855961cda3ed6be392  $tools/codex.tar.gz" | sha256sum --check
            tar -xzf "$tools/codex.tar.gz" -C "$tools" codex-x86_64-unknown-linux-musl
            host="$(mktemp -d)"
            chmod 755 "$host"
            install -m 755 "$tools/codex-x86_64-unknown-linux-musl" "$host/codex"
            sudo -n install -d -m 700 -o nobody "$host/home"
            mkdir "$host/workspace"
            chmod 755 "$host/workspace"
            sudo -n install -m 600 -o nobody /dev/null "$host/host.json"
            echo "ad83b94c093f0cdd8176a6bc8005a461bdf23a759863e157d40f562b8a9d664d  $host/codex" | sha256sum --check
            "$host/codex" --version
            echo "CW_CODEX=$host/codex" >> "$GITHUB_ENV"
            echo "CW_HOST_PUBLIC=$host" >> "$GITHUB_ENV"
          else
            echo "::warning::Pinned Codex CLI could not be staged"
          fi
          echo "CW_NODE=$(command -v node)" >> "$GITHUB_ENV"
          node --version
          chrome="$(command -v google-chrome || command -v chromium || true)"
          echo "CW_CHROME=$chrome" >> "$GITHUB_ENV"
          if [[ -n "$chrome" ]]; then "$chrome" --version; fi
      - name: Run installed Step 9 operations without external egress
        run: |
          root="$RUNNER_TEMP/kit-consumer"
          mkdir "$root/step9"
          cd "$root/empty"
          sudo -n ip netns add cw-kit9
          trap 'sudo -n ip netns del cw-kit9' EXIT
          sudo -n ip -n cw-kit9 link set lo up
          sudo -n ip netns exec cw-kit9 runuser -u "$USER" -- \
            env -i PATH=/usr/bin:/bin HOME="$root/empty" PYTHONDONTWRITEBYTECODE=1 \
            CW_HOST_PUBLIC="${CW_HOST_PUBLIC:-}" CW_NODE="$CW_NODE" \
            timeout 150s python3 "$root/bootstrap/step9.py" \
              --bootstrap "$root/bootstrap" --release "$root/release" --revision "$GITHUB_SHA" \
              --chrome "${CW_CHROME:-}" --codex "${CW_CODEX:-}" --out "$root/step9/step-9.json"
      - name: Expose Step 9 and local App Server observations
        if: always()
        run: |
          root="$RUNNER_TEMP/kit-consumer"
          python3 - "$root/step9/step-9.json" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if not path.is_file():
              print(json.dumps({"step9": "UNVERIFIED", "reason": "no consumer receipt"}))
              raise SystemExit(0)
          data = json.loads(path.read_text())
          print(json.dumps({key: data[key] for key in ("revision", "verdict", "incomplete", "unverified_gates")}))
          for offset in range(0, len(data["checks"]), 8):
              print(json.dumps({"offset": offset, "checks": data["checks"][offset:offset+8]}))
          for key in ("host", "browser", "extension", "network_lifecycle", "guided_network_clicks", "guided_network_lifecycle", "installation_clicks"):
              if key in data["detail"]:
                  print(json.dumps({"scope": key, "evidence": data["detail"][key]})[:16000])
          PY
      - name: Preserve Step 9 evidence
        id: step9_upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kit-step9-consumer
          path: ${{ runner.temp }}/kit-consumer/step9
          retention-days: 14
          if-no-files-found: error
      - name: Verify archived Step 9 observations
        if: always() && steps.step9_upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_ID: ${{ steps.step9_upload.outputs.artifact-id }}
          RECEIPT_SHA: ${{ steps.step9_upload.outputs.artifact-digest }}
        run: |
          root="$RUNNER_TEMP/kit-consumer"
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --location --max-time 15 \
              -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$RECEIPT_ID/zip" \
              -o "$root/step9-receipt.zip"; then break; fi
            if [[ "$attempt" == 3 ]]; then exit 2; fi
            sleep 2
          done
          echo "${RECEIPT_SHA#sha256:}  $root/step9-receipt.zip" | sha256sum --check
          python3 - "$root" <<'PY'
          import hashlib, json, os, sys, zipfile
          from pathlib import Path
          root = Path(sys.argv[1])
          with zipfile.ZipFile(root / "step9-receipt.zip") as bundle:
              receipt = bundle.read("step-9.json")
              if bundle.namelist() != ["step-9.json"] or receipt != (root / "step9/step-9.json").read_bytes():
                  raise SystemExit("archive member verification failed")
          print(json.dumps({"step9_custody": "verified", "artifact": os.environ["RECEIPT_ID"],
                            "sha256": os.environ["RECEIPT_SHA"], "member_sha256": hashlib.sha256(receipt).hexdigest()}))
          PY
      - name: Remove disposable optional host
        if: always()
        run: |
          if [[ -n "${CW_HOST_PUBLIC:-}" && "$CW_HOST_PUBLIC" == /tmp/tmp.* ]]; then
            sudo -n rm -rf -- "$CW_HOST_PUBLIC"
          fi

      - name: Enforce guided and command acceptance receipt verdict
        if: always()
        run: |
          python3 - "${RUNNER_TEMP}/kit-consumer/step9/step-9.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          try:
              receipt = json.loads(path.read_text())
          except (OSError, ValueError):
              receipt = {}
          if receipt.get("revision") != os.environ["GITHUB_SHA"]:
              print("::error::Step 9 UNVERIFIED: exact-revision receipt absent")
              raise SystemExit(2)
          verdict = receipt.get("verdict")
          if verdict == "PASS":
              raise SystemExit(0)
          print(f"::error::Step 9 {verdict or 'UNVERIFIED'}")
          raise SystemExit(1 if verdict == "FAIL" else 2)
          PY
